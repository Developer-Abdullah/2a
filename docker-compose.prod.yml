version: '3.8'
services:
  core-api:
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
  signing-worker:
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: always
  notifier-worker:
    deploy:
      replicas: 2
    restart: always
  analytics-worker:
    deploy:
      replicas: 1
    restart: always
  admin-dashboard:
    deploy:
      replicas: 2
    restart: always
